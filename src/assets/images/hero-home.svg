<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img">
  <title>A fan of queue lines converging on a single service window, with a row of ticket stubs below, in flat gold and black on cream</title>
  <defs>
    <path id="stub" d="M0,20 L11,8 L22,20 L33,8 L44,20 L55,8 L66,20 L77,8 L88,20 L99,8 L110,20 L110,140 L0,140 Z" />
  </defs>

  <rect x="0" y="0" width="1600" height="700" fill="#f2e9d8" />

  <!-- fan of queue lines converging on the counter window -->
  <g>
    <polygon points="1300,230 80,20 80,80" fill="#1c1a17" />
    <polygon points="1300,230 80,80 80,140" fill="#b97d1c" />
    <polygon points="1300,230 80,140 80,200" fill="#1c1a17" />
    <polygon points="1300,230 80,200 80,260" fill="#b97d1c" />
    <polygon points="1300,230 80,260 80,320" fill="#1c1a17" />
    <polygon points="1300,230 80,320 80,380" fill="#b97d1c" />
    <polygon points="1300,230 80,380 80,440" fill="#1c1a17" />
  </g>

  <!-- service window -->
  <rect x="1240" y="110" width="240" height="240" rx="18" fill="#1c1a17" />
  <rect x="1265" y="135" width="190" height="190" rx="10" fill="#f2e9d8" />
  <circle cx="1360" cy="230" r="52" fill="#b97d1c" />

  <!-- counter divider -->
  <rect x="0" y="470" width="1600" height="14" fill="#1c1a17" />

  <!-- queued ticket stubs -->
  <g>
    <use href="#stub" x="60" y="530" fill="#1c1a17" />
    <use href="#stub" x="200" y="530" fill="#b97d1c" />
    <use href="#stub" x="340" y="530" fill="#1c1a17" />
    <use href="#stub" x="480" y="530" fill="#b97d1c" />
    <use href="#stub" x="620" y="530" fill="#1c1a17" />
    <use href="#stub" x="760" y="530" fill="#b97d1c" />
    <use href="#stub" x="900" y="530" fill="#1c1a17" />
    <use href="#stub" x="1040" y="530" fill="#b97d1c" />
    <use href="#stub" x="1180" y="530" fill="#1c1a17" />
    <use href="#stub" x="1320" y="530" fill="#b97d1c" />
    <use href="#stub" x="1460" y="530" fill="#1c1a17" />
  </g>

  <!-- bureaucratic stamp accent -->
  <g transform="rotate(-12 1440 600)" opacity="0.55">
    <circle cx="1440" cy="600" r="46" fill="none" stroke="#1c1a17" stroke-width="5" />
    <path d="M1418,600 L1434,616 L1464,584" fill="none" stroke="#1c1a17" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
